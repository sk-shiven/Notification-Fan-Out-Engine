[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fanout"
version = "0.1.0"
description = "Notification Fan-Out Engine: High-reliability, distributed notification delivery with transactional outbox CDC"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Shiven Kathuria", email = "shiven.25bcs10290@sst.scaler.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aiokafka>=0.12.0",
    "httpx>=0.27.2",
    "redis[hiredis]>=5.1.1",
    "prometheus-client>=0.21.0",
    "aiosmtplib>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fanout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
